<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프레시 팜 - 산지직송 제철과일</title>
    <link rel="stylesheet" href="style.css">
    <style>
    /* 인트로 전용 레이아웃 */
        .intro-page {
            padding: 30px 0 60px;
        }
        .intro-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
        }
        .intro-visual {
        width: 1200px;
        height: 410px;
        border-radius: 8px;
        margin-bottom: 40px;
        }
        .intro-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .intro-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #E2E8F0;
            color: #1E293B;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .intro-title {
            font-size: 34px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 16px;
        }
        .intro-desc {
            font-size: 16px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .intro-cta {
            width: 240px;
            font-size: 16px;
        }
        .intro-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }
  </style>
</head>
<body>
  
    <div class="container intro-page">
    <!-- 상단 간이 헤더 -->
    <header class="intro-nav">
        <div class="logo">프레시 팜</div>
        <a href="menu.html" style="color: #6B7280; font-size: 15px;">둘러보기 &gt;</a>
    </header>

    <!-- 과일 대표 이미지 영역 -->
    <div class="intro-visual">
        <img src="image/mainfruit.avif" alt="신선한 제철 과일 모음">
    </div>

    <!-- 인트로 소개 텍스트 및 CTA 버튼 -->
    <main class="intro-content">
        <div class="intro-badge">🌿 산지직송 제철과일</div>
        <h1 class="intro-title">새벽에 수확한 신선함, 식탁으로 바로 갑니다.</h1>
        <p class="intro-desc">
        중간 유통 거품 없이 전국 우수 농가의 고당도 과일을<br>
        가장 신선한 상태로 만나보세요.</p>
        <a href="menu.html" class="btn-primary intro-cta">제철 과일 둘러보기</a>
    </main>
  </div>
</body>
</html>
